name: Sync upstream

# Every Monday, merge browser-use/jev-ultrafast into a branch, run the tests,
# and open a pull request. A conflict opens an issue instead.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Merge upstream and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add upstream https://github.com/browser-use/jev-ultrafast.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi
          sha=$(git rev-parse --short upstream/main)
          branch="sync/upstream-$sha"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            title="Upstream sync needs a manual merge ($sha)"
            if ! gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' | grep -q .; then
              gh issue create --title "$title" --body "Merging browser-use/jev-ultrafast@$sha into main conflicts. Merge it by hand: \`git fetch upstream && git merge upstream/main\`."
            fi
            exit 0
          fi
          if uv sync --quiet && uv run pytest -q tests; then result="Tests pass."; else result="**Tests fail: check before merging.**"; fi
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Sync upstream ($sha)" \
            --body "Merges the latest browser-use/jev-ultrafast main. $result Merging it publishes the update to the public fork."
