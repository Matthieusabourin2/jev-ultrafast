<!doctype html><html lang="fr"><meta charset="utf-8"><title>Catalogue</title>
<body><header><div class="bar"><input id="q" type="text" placeholder="Rechercher un article"><button class="icon" onclick="go()">&#x1F50D;&#xFE0E;</button></div></header>
<main id="out"><p>Bienvenue dans le catalogue.</p></main>
<script>function go(){const q=document.getElementById('q').value; document.getElementById('out').insertAdjacentHTML('beforeend','<h2>5 articles pour '+q+'</h2>'); window.__result='search:'+q}</script></body></html>
