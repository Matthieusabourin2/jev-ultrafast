<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Instructions du projet</title>
<style>body{font:15px sans-serif;margin:30px}textarea{width:420px;height:80px;display:block;margin:8px 0}</style></head><body>
<h1>Instructions du projet</h1>
<label for="ins">Instructions</label><textarea id="ins">Ancien texte</textarea>
<button id="save">Enregistrer les instructions</button>
<script>save.onclick=()=>{window.__result=ins.value;document.title='Fait';document.body.insertAdjacentHTML('beforeend','<p>Instructions enregistrées.</p>')};</script>
</body></html>
