<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Partager « Rapport Q3 »</title>
<style>body{font:15px sans-serif;margin:30px}</style></head><body>
<h1>Partager « Rapport Q3 »</h1>

<select id="role"><option>Lecteur</option><option>Commentateur</option><option>Éditeur</option></select>
