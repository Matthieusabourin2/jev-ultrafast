<!doctype html><meta charset="utf-8"><title>Product reviews</title>
<h1>Blue mug</h1>
<label>Your review <input id="review" type="text"></label>
<div id="modal" hidden style="position:fixed;inset:20% 30%;background:#fff;border:2px solid #333;padding:20px">
  <h2>Sign in to post a review</h2>
  <label>Email <input id="email" type="email"></label>
  <button>Continue</button>
</div>
<script>
  // Clicking the review box opens a sign-in modal and moves focus to its email field.
  document.getElementById('review').addEventListener('mousedown', e => {
    e.preventDefault();
    document.getElementById('modal').hidden = false;
    document.getElementById('email').focus();
  });
</script>
