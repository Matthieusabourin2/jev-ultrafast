<!doctype html><meta charset="utf-8"><title>Verify your device</title>
<h1>Verify your device</h1>
<p>We sent a code to your phone.</p>
<form onsubmit="event.preventDefault(); document.body.append('Verified')">

  <button>Verify</button>
</form>
